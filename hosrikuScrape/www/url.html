<!DOCTYPE html>
<html lang="ja">

  <head>
    <meta charset="utf-8">
    <title>ホスリクスクレイピングツール</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/button.css">
  </head>

  <body>
    <h1>ホスリクURL取得</h1>
    <div class="wrapper">
      <div class="operation_area">
        <h4>対象エリア</h4>
        <div class="cp_ipselect02">
          <select id="prefecture" name="prefecture">
            <option value="" selected>選択してください</option>
            <option value="1">北海道</option>
            <option value="11">埼玉県</option>
            <option value="12">千葉県</option>
            <option value="13">東京都</option>
            <option value="14">神奈川県</option>
            <option value="17">石川県</option>
            <option value="23">愛知県</option>
            <option value="26">京都府</option>
            <option value="27">大阪府</option>
            <option value="28">兵庫県</option>
            <option value="33">岡山県</option>
            <option value="34">広島県</option>
            <option value="36">徳島県</option>
            <option value="37">香川県</option>
            <option value="38">愛媛県</option>
            <option value="43">熊本県</option>
            <option value="46">鹿児島県</option>
            <option value="47">沖縄県</option>
          </select>
        </div>
        <div class="button_area">
          <div><button class="button-g button-4 button-wide" onclick="gotoScrape();">開始</button></div>
          <div><button class="button-g button-wide" onclick="pauseScrape();">中断</button></div>
        </div>
      </div>
      <div class="progress_area">
        <div>成功:<span id="success"></span>/<span id="successtotal"></span></div>
        <div>失敗:<span id="fail"></span>/<span id="failtotal"></span></div>
      </div>
      <div class="operation_area">
        <h3>ステータス</h3>
        <div id="scrapingstatus"></div>
      </div>
      <div class="operation_area">
        <button type="button" id="topbutton" class="button-g button-6 button-wide" role="button"
          onclick="transfer('top_page');">トップへ戻る</button>
      </div>
      <button class="button-g button-1 button-wide" value="exit" onclick="exitApp();">終了
    </div>
    <footer>
      <p>
        <small>&copy; 2026 Satsuma Ebisudo All Rights Reserved.</small>
      </p>
    </footer>

    <script>
      /// dom
      // status
      const scrapingstatusDom = document.getElementById('scrapingstatus');
      // successtotal
      const successtotalDom = document.getElementById('successtotal');
      // success
      const successDom = document.getElementById('success');
      // failtotal
      const failtotalDom = document.getElementById('failtotal');
      // fail
      const failDom = document.getElementById('fail');

      // shop total
      window.api.on('urltotal', arg => {
        // shop success total dom
        successtotalDom.innerHTML = arg;
        // shop fail total dom
        failtotalDom.innerHTML = arg;
      });
      // success
      window.api.on('urlsuccess', arg => {
        // area success dom
        successDom.innerHTML = arg;
      });
      // fail
      window.api.on('urlfail', arg => {
        // area fail dom
        failDom.innerHTML = arg;
      });
      // status Update
      window.api.on('statusUpdate', arg => {
        try {
          // status Update
          scrapingstatusDom.innerHTML = `
          scraping url: ${arg}`;

        } catch (e) {
          // error
          console.log(e);
        }
      });
      // page transfer
      const transfer = channel => {
        try {
          // page transfer
          window.api.send('page', channel);

        } catch (e) {
          // error
          console.log(e);
        }
      }
      // start scraping
      const gotoScrape = () => {
        try {
          // initialize form
          scrapingstatusDom.innerHTML = '';
          // select dom
          const select = document.getElementById('prefecture');
          console.log(select.value);
          // start scraping
          window.api.send('scrapeurl', select.value);

        } catch (e) {
          // error
          console.log(e);
        }
      }
      // pause Scraping
      const pauseScrape = () => {
        try {
          // pause Scraping
          window.api.send("pause");
        } catch (e) {
          // error
          console.log(e);
        }
      }
      // exit App
      const exitApp = () => {
        try {
          // exit App
          window.api.send('exit');

        } catch (e) {
          // error
          console.log(e);
        }
      }
    </script>
  </body>

</html>
