<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <title>premol scraper</title>
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
  <link rel="stylesheet" href="css/index.css">
</head>

<body>
  <h1>premol url scraper</h1>
  <div class="wrapper">
    <div class="button_area">
      <div class="operation_area">
        <h3>targetURL</h3>
        prefectureID&emsp;<input type="number" id="prefecture" name="prefecture" min="1" max="47" />
        <div><button class="button-g button-2 button-wide" onclick="gotoScrape();">get URLs</button></div>
        <div><button class="button-g button-wide" onclick="pauseScrape();">pause</button></div>
      </div>
      <div class="operation_area">
        <button type="button" id="topbutton" class="button-g button-6 button-wide" role="button"
          onclick="transfer('top_page');">go to top</button>
      </div>
      <div class="operation_area">
        <button class="button-g button-4 button-wide" value="exit" onclick="exitApp();">exit</button>
      </div>
    </div>
  </div>

  <footer>
    <p><small>&copy; 2024 Satsuma Ebisudo All Rights Reserved. </small></p>
  </footer>

  <script>
    // prefecture Dom
    const prefectureDom = document.getElementById('prefecture');

    // start scraping
    const gotoScrape = () => {
      try {
        // start scraping
        window.api.send('scrapeurl', prefectureDom.value);

      } catch (e) {
        // error
        console.log(e);
      }
    }

    // pause Scraping
    const pauseScrape = () => {
      try {
        // pause Scraping
        window.api.send('pause', 'url');

      } catch (e) {
        // error
        console.log(e);
      }
    }

    // exit App
    const exitApp = () => {
      try {
        // exit App
        window.api.send('exit');

      } catch (e) {
        // error
        console.log(e);
      }
    }

    // page transfer
    const transfer = channel => {
      try {
        // page transfer
        window.api.send('page', channel);

      } catch (e) {
        // error
        console.log(e);
      }
    }
  </script>
</body>

</html>
