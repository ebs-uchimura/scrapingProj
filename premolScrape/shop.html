<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <title>premol scraper</title>
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
  <link rel="stylesheet" href="css/index.css">
</head>

<body>
  <h1>premol shopinfo scraper</h1>
  <div class="wrapper">
    <div class="button_area">
      <div class="operation_area">
        <h3>read CSV</h3>
        <div><button class="button-g button-wide" value="regist" onclick="readCSV();">read CSV</button></div>
        <div id="csvfilepath"></div>
      </div>
      <div class="operation_area">
        <h3>scraping</h3>
        <div><button class="button-g button-wide button-2" value="edit" onclick="gotoScrape();">start scraping</button></div>
        <div><button class="button-g button-wide" onclick="pauseScrape();">pause scraping</button></div>
      </div>
      <div class="operation_area">
        <div><button class="button-g button-4 button-wide " value="reader" onclick="clearCSV()">clear</button></div>
        <div><button type="button" id="topbutton" class="button-6 button-g button-wide" role="button"
            onclick="transfer('top_page');">goto top</button></div>
        <div><button class="button-g button-4 button-wide" value="exit" onclick="exitApp();">exit</button></div>
      </div>
    </div>
  </div>

  <footer>
    <p><small>&copy; 2024 Satsuma Ebisudo All Rights Reserved. </small></p>
  </footer>

  <script>
    // CSV file dom
    const csvfileDom = document.getElementById('csvfilepath');

    // shopinfo Csvlist
    window.api.on("shopinfoCsvlist", arg => {
      try {
        // user list
        const shopinfoArray = arg.record.flat();
        // convert to JSON
        const serializedArray = JSON.stringify(shopinfoArray);
        // save localStorage
        localStorage.setItem('shopinfoArray', serializedArray);
        // show file path
        csvfileDom.innerHTML = arg.filename;

      } catch (e) {
        // error
        console.log(e);
      }
    });

    // read CSV
    const readCSV = () => {
      try {
        // read CSV
        window.api.send("csv", '');

      } catch (e) {
        // error
        console.log(e);
      }
    }

    // clear CSV
    const clearCSV = () => {
      try {
        // clear localStorage
        localStorage.clear();
        // clear file path
        csvfileDom.innerHTML = "";

      } catch (e) {
        // error
        window.api.send("error", e);
      }
    }

    // start scraping
    const gotoScrape = () => {
      try {
        // shop ul list
        const serializedArray = JSON.parse(localStorage.getItem('shopinfoArray'));
        // start scraping
        window.api.send("scrape", serializedArray);

      } catch (e) {
        // error
        console.log(e);
      }
    }

    // pause Scraping
    const pauseScrape = () => {
      try {
        // pause Scraping
        window.api.send("pause", "shop");

      } catch (e) {
        // error
        console.log(e);
      }
    }

    // exit App
    const exitApp = () => {
      try {
        // exit App
        window.api.send("exit");

      } catch (e) {
        // error
        console.log(e);
      }
    }

    // page transfer
    const transfer = channel => {
      try {
        // page transfer
        window.api.send("page", channel);

      } catch (e) {
        // error
        console.log(e);
      }
    }
  </script>
</body>

</html>
