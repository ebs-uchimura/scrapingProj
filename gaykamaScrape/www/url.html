<!DOCTYPE html>
<html lang="ja">

  <head>
    <meta charset="utf-8">
    <title>ゲイカマスクレイピングツール</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/button.css">
  </head>

  <body>
    <h1>ゲイカマURL取得</h1>
    <div class="wrapper">
      <div class="operation_area">
        <h4>対象エリア</h4>
        <div class="cp_ipselect02">
          <select id="prefecture" name="prefecture">
            <option value="" selected>選択してください</option>
            <option value="北海道">北海道</option>
            <option value="青森">青森県</option>
            <option value="宮城">宮城県</option>
            <option value="秋田">秋田県</option>
            <option value="山形">山形県</option>
            <option value="茨城">茨城県</option>
            <option value="栃木">栃木県</option>
            <option value="埼玉">埼玉県</option>
            <option value="千葉">千葉県</option>
            <option value="東京">東京都</option>
            <option value="神奈川">神奈川県</option>
            <option value="新潟">新潟県</option>
            <option value="富山">富山県</option>
            <option value="山梨">山梨県</option>
            <option value="長野">長野県</option>
            <option value="静岡">静岡県</option>
            <option value="愛知">愛知県</option>
            <option value="三重">三重県</option>
            <option value="滋賀">滋賀県</option>
            <option value="京都">京都府</option>
            <option value="大阪">大阪府</option>
            <option value="兵庫">兵庫県</option>
            <option value="和歌山">和歌山県</option>
            <option value="岡山">岡山県</option>
            <option value="広島">広島県</option>
            <option value="香川">香川県</option>
            <option value="福岡">福岡県</option>
            <option value="熊本">熊本県</option>
            <option value="大分">大分県</option>
            <option value="鹿児島">鹿児島県</option>
            <option value="沖縄">沖縄県</option>
          </select>
        </div>
        <div class="button_area">
          <div><button class="button-g button-4 button-wide" onclick="gotoScrape();">開始</button></div>
          <div><button class="button-g button-wide" onclick="pauseScrape();">中断</button></div>
        </div>
      </div>
      <div class="progress_area">
        <div>成功:<span id="success"></span>/<span id="successtotal"></span></div>
        <div>失敗:<span id="fail"></span>/<span id="failtotal"></span></div>
      </div>
      <div class="operation_area">
        <h3>ステータス</h3>
        <div id="scrapingstatus"></div>
      </div>
      <div class="operation_area">
        <button type="button" id="topbutton" class="button-g button-6 button-wide" role="button"
          onclick="transfer('top_page');">トップへ戻る</button>
      </div>
      <button class="button-g button-1 button-wide" value="exit" onclick="exitApp();">終了
    </div>
    <footer>
      <p>
        <small>&copy; 2026 Satsuma Ebisudo All Rights Reserved.</small>
      </p>
    </footer>

    <script>
      /// dom
      // status
      const scrapingstatusDom = document.getElementById('scrapingstatus');
      // successtotal
      const successtotalDom = document.getElementById('successtotal');
      // success
      const successDom = document.getElementById('success');
      // failtotal
      const failtotalDom = document.getElementById('failtotal');
      // fail
      const failDom = document.getElementById('fail');

      // shop total
      window.api.on('urltotal', arg => {
        // shop success total dom
        successtotalDom.innerHTML = arg;
        // shop fail total dom
        failtotalDom.innerHTML = arg;
      });
      // success
      window.api.on('urlsuccess', arg => {
        // area success dom
        successDom.innerHTML = arg;
      });
      // fail
      window.api.on('urlfail', arg => {
        // area fail dom
        failDom.innerHTML = arg;
      });
      // status Update
      window.api.on('statusUpdate', arg => {
        try {
          // status Update
          scrapingstatusDom.innerHTML = `
          scraping url: ${arg}`;

        } catch (e) {
          // error
          console.log(e);
        }
      });
      // page transfer
      const transfer = channel => {
        try {
          // page transfer
          window.api.send('page', channel);

        } catch (e) {
          // error
          console.log(e);
        }
      }
      // start scraping
      const gotoScrape = () => {
        try {
          // initialize form
          scrapingstatusDom.innerHTML = '';
          // select dom
          const select = document.getElementById('prefecture');
          // start scraping
          window.api.send('scrapeurl', select.value);

        } catch (e) {
          // error
          console.log(e);
        }
      }
      // pause Scraping
      const pauseScrape = () => {
        try {
          // pause Scraping
          window.api.send("pause");
        } catch (e) {
          // error
          console.log(e);
        }
      }
      // exit App
      const exitApp = () => {
        try {
          // exit App
          window.api.send('exit');

        } catch (e) {
          // error
          console.log(e);
        }
      }
    </script>
  </body>

</html>
