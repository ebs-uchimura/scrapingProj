<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <title>ホットペッパースクレイピングツール</title>
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/button.css">
</head>

<body>
  <h1>ホットペッパースクレイピングツール</h1>
  <div class="button_area">
    <div class="operation_area">
      <h3>URL取得画面</h3>
      <button class="button-g button-wide" value="url" onclick="transfer('url_page');">URL取得画面</button>
    </div>
    <div class="operation_area">
      <h3>店舗情報取得画面</h3>
      <button class="button-g button-wide" value="shop" onclick="transfer('shop_page');">店舗情報取得画面
    </div>
    <div class="operation_area">
      <button class="button-g button-3 button-standard" value="exit" onclick="exitApp();">終了</button>
    </div>
  </div>
  <footer>
    <p><small>&copy; 2025 Satsuma Ebisudo All Rights Reserved. </small></p>
  </footer>

  <script>
    // page transfer
    const transfer = channel => {
      try {
        // page transfer
        window.api.send("page", channel);

      } catch (e) {
        // error
        console.log(e);
      }
    }

    // exit App
    const exitApp = () => {
      try {
        // exit App
        window.api.send("exit");

      } catch (e) {
        // error
        console.log(e);
      }
    }
  </script>
</body>

</html>
