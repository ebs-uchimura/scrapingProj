<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <title>tabelog scraper</title>
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
  <link rel="stylesheet" href="css/index.css">
</head>

<body>
  <h1>tabelog scraper</h1>
  <div class="wrapper">
    <div class="button_area">
      <div class="operation_area">
        <h3>targetURL</h3>
        <div><input type="text" id="targeturl" class="middle" value=""></div>
        <div><button class="button-g button-2 button-wide" onclick="gotoScrape();">get URLs</button></div>
        <div><button class="button-g button-wide" onclick="pauseScrape();">pause</button></div>
      </div>
      <div class="progressarea">
        <div>success:<span id="success"></span>/<span id="successtotal"></span></div>
        <div>fail:<span id="fail"></span>/<span id="failtotal"></span></div>
      </div>
      <div class="operation_area">
        <h3>status</h3>
        <div id="scrapingstatus"></div>
      </div>
      <div class="operation_area">
        <button type="button" id="topbutton" class="button-g button-6 button-wide" role="button"
          onclick="transfer('top_page');">go to top</button>
      </div>
      <div class="operation_area">
        <button class="button-g button-4 button-wide" value="exit" onclick="exitApp();">exit</button>
      </div>
    </div>
  </div>

  <footer>
    <p><small>&copy; 2024 Satsuma Ebisudo All Rights Reserved. </small></p>
  </footer>

  <script>
    /// dom
    // status
    const scrapingstatusDom = document.getElementById('scrapingstatus');
    // targetUrl
    const targetUrlDom = document.getElementById('targeturl');
    // success
    const successDom = document.getElementById('success');
    // fail
    const failDom = document.getElementById('fail');
    // success total
    const successtotalDom = document.getElementById('successtotal');
    // fail total
    const failtotalDom = document.getElementById('failtotal');

    // total
    window.api.on('total', arg => {
      // success total
      successtotalDom.innerHTML = arg;
      // fail total
      failtotalDom.innerHTML = arg;
    });

    // success
    window.api.on('success', arg => {
      // success
      successDom.innerHTML = arg;
    });

    // fail
    window.api.on('fail', arg => {
      // fail
      failDom.innerHTML = arg;
    });

    // status Update
    window.api.on("statusUpdate", arg => {
      try {
        // status Update
        scrapingstatusDom.innerHTML = `
          scraping: ${arg}`;

      } catch (e) {
        // error
        console.log(e);
      }
    });

    // page transfer
    const transfer = channel => {
      try {
        // page transfer
        window.api.send("page", channel);

      } catch (e) {
        // error
        console.log(e);
      }
    }

    // start scraping
    const gotoScrape = () => {
      try {
        // initialize form
        successDom.innerHTML = '';
        failDom.innerHTML = '';
        successtotalDom.innerHTML = '';
        failtotalDom.innerHTML = '';
        // start scraping
        window.api.send("scrapeurl", targetUrlDom.value);

      } catch (e) {
        // error
        console.log(e);
      }
    }

    // pause Scraping
    const pauseScrape = () => {
      try {
        // pause Scraping
        window.api.send("pause", "url");

      } catch (e) {
        // error
        console.log(e);
      }
    }

    // exit App
    const exitApp = () => {
      try {
        // exit App
        window.api.send("exit");

      } catch (e) {
        // error
        console.log(e);
      }
    }

    
  </script>
</body>

</html>
