<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <title>食べログスクレイピングツール</title>
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
  <link rel="stylesheet" href="css/index.css">
</head>

<body>
  <h1>食べログURL取得</h1>
  <div class="wrapper">
    <div class="operation_area">
      <h4>対象エリア</h4>
      <div class="cp_ipselect02">
        <select id="prefecture" name="prefecture">
          <option value="" selected>選択してください</option>
          <option value="hokkaido">北海道</option>
          <option value="aomori">青森県</option>
          <option value="iwate">岩手県</option>
          <option value="miyagi">宮城県</option>
          <option value="akita">秋田県</option>
          <option value="yamagata">山形県</option>
          <option value="fukushima">福島県</option>
          <option value="ibaraki">茨城県</option>
          <option value="tochigi">栃木県</option>
          <option value="gunma">群馬県</option>
          <option value="saitama">埼玉県</option>
          <option value="chiba">千葉県</option>
          <option value="tokyo">東京都</option>
          <option value="kanagawa">神奈川県</option>
          <option value="niigata">新潟県</option>
          <option value="toyama">富山県</option>
          <option value="ishikawa">石川県</option>
          <option value="fukui">福井県</option>
          <option value="yamanashi">山梨県</option>
          <option value="nagano">長野県</option>
          <option value="gifu">岐阜県</option>
          <option value="shizuoka">静岡県</option>
          <option value="aichi">愛知県</option>
          <option value="mie">三重県</option>
          <option value="shiga">滋賀県</option>
          <option value="kyoto">京都府</option>
          <option value="osaka">大阪府</option>
          <option value="hyogo">兵庫県</option>
          <option value="nara">奈良県</option>
          <option value="wakayama">和歌山県</option>
          <option value="tottori">鳥取県</option>
          <option value="shimane">島根県</option>
          <option value="oakayama">岡山県</option>
          <option value="hiroshima">広島県</option>
          <option value="yamaguchi">山口県</option>
          <option value="tokushima">徳島県</option>
          <option value="kagawa">香川県</option>
          <option value="ehime">愛媛県</option>
          <option value="kochi">高知県</option>
          <option value="fukuoka">福岡県</option>
          <option value="saga">佐賀県</option>
          <option value="nagasaki">長崎県</option>
          <option value="kumamoto">熊本県</option>
          <option value="oita">大分県</option>
          <option value="miyazaki">宮崎県</option>
          <option value="kagoshima">鹿児島県</option>
          <option value="okinawa">沖縄県</option>
        </select>
      </div>
      <div class="button_area">
        <button class="button-g button-2 button-wide" onclick="gotoScrape();">開始</button>
      </div>
      <div class="button_area">
        <button class="button-g button-wide" onclick="pauseScrape();">中断</button>
      </div>
      <div class="button_area">
        <button class="button-g button-wide" onclick="clearScrape();">履歴クリア</button>
      </div>
    </div>
    <div class="progress_area">
      <div>
        都道府県合計数:
        <span id="preftotal"></span>
      </div>
      <div>
        大エリア成功:
        <span id="area"></span>/<span id="areatotal"></span>
      </div>
      <div>
        小エリア成功:
        <span id="city"></span>/<span id="citytotal"></span>
      </div>
    </div>
    <div class="operation_area">
      <h3>ステータス</h3>
      <div id="scrapingstatus"></div>
    </div>
    <div class="operation_area">
      <button type="button" id="topbutton" class="button-g button-6 button-wide" role="button"
        onclick="transfer('top_page');">トップへ戻る</button>
    </div>
    <div class="operation_area">
      <button class="button-g button-1 button-wide" value="exit" onclick="exitApp();">終了</button>
    </div>
  </div>
  <footer>
    <p>
      <small>&copy; 2024 Satsuma Ebisudo All Rights Reserved.</small>
    </p>
  </footer>

  <script>
    /// dom
    // status
    const scrapingstatusDom = document.getElementById('scrapingstatus');
    // preftotal
    const preftotalDom = document.getElementById('preftotal');
    // areatotal
    const areatotalDom = document.getElementById('areatotal');
    // citytotal
    const citytotalDom = document.getElementById('citytotal');
    // area
    const areaDom = document.getElementById('area');
    // city
    const cityDom = document.getElementById('city');

    // pref total
    window.api.on('preftotal', arg => {
      // pref total dom
      preftotalDom.innerHTML = arg;
    });

    // area total
    window.api.on('areatotal', arg => {
      // area total dom
      areatotalDom.innerHTML = arg;
    });
    
    // city total
    window.api.on('citytotal', arg => {
      // city total dom
      citytotalDom.innerHTML = arg;
    });

    // area success
    window.api.on('areasuccess', arg => {
      // area success dom
      areaDom.innerHTML = arg;
    });

    // city success
    window.api.on('citysuccess', arg => {
      // city success dom
      cityDom.innerHTML = arg;
    });

    // status Update
    window.api.on("statusUpdate", arg => {
      try {
        // status Update
        scrapingstatusDom.innerHTML = `
          scraping url: ${arg}`;

      } catch (e) {
        // error
        console.log(e);
      }
    });

    // page transfer
    const transfer = channel => {
      try {
        // page transfer
        window.api.send("page", channel);

      } catch (e) {
        // error
        console.log(e);
      }
    }

    // start scraping
    const gotoScrape = () => {
      try {
        // initialize form
        preftotalDom.innerHTML = '';
        areaDom.innerHTML = '';
        cityDom.innerHTML = '';
        scrapingstatusDom.innerHTML = '';
        // select dom
        const select = document.getElementById('prefecture');
        // send obj
        const obj = {
          pref: select.value,
          index: select.selectedIndex,
        }
        // error
        if (select.selectedIndex == 0) {
          // error
          window.api.send("error", '都道府県が選択されていません');
        }
        // start scraping
        window.api.send("scrapeurl", obj);

      } catch (e) {
        // error
        console.log(e);
      }
    }

    // pause Scraping
    const pauseScrape = () => {
      try {
        // select dom
        const select = document.getElementById('prefecture');
        // pause Scraping
        window.api.send("pause", {
          type: "url",
          index: select.selectedIndex,
        });

      } catch (e) {
        // error
        console.log(e);
      }
    }

    // clear Scraping
    const clearScrape = () => {
      try {
        // pause Scraping
        window.api.send("clear");

      } catch (e) {
        // error
        console.log(e);
      }
    }

    // exit App
    const exitApp = () => {
      try {
        // exit App
        window.api.send("exit");

      } catch (e) {
        // error
        console.log(e);
      }
    }
  </script>
</body>

</html>
