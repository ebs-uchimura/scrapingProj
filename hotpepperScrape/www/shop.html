<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <title>ホットペッパースクレイピングツール</title>
    <meta http-equiv="Content-Security-Policy"
        content="script-src 'self' 'unsafe-inline';">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/button.css">
</head>
<body>
    <h1>ホットペッパースクレイピングツール</h1>
    <div class="wrapper">
        <div class="operation_area">
            <h3>CSV読込</h3>
            <div><button class="button-g button-wide" value="regist"
                    onclick="readCSV();">CSV読込</button></div>
            <div id="csvfilepath"></div>
        </div>
        <div class="operation_area">
            <h3>スクレイピング</h3>
            <h4>開始位置</h4><br>
            <div><input type="number" id="tentacles" name="tentacles" min="1"
                    max="100000"></div><br>
            <div><button class="button-g button-wide button-8" value="edit"
                    onclick="gotoScrape();">開始</button></div><br>
            <div><button class="button-g button-wide"
                    onclick="pauseScrape();">中断</button>
            </div>
        </div>
        <div class="progressarea">
            <div>成功:<span id="success"></span>/<span id="successtotal"></span>
            </div>
            <div>失敗:<span id="fail"></span>/<span id="failtotal"></span></div>
        </div>
        <div class="operation_area">
            <h3>ステータス</h3>
            <div id="scrapingurl"></div>
            <div id="scrapingstatus"></div>
        </div>
        <div class="operation_area">
            <button type="button" id="topbutton"
                class="button-6 button-g button-wide" role="button"
                onclick="transfer('top_page');">トップへ戻る</button>
        </div>
        <div>
            <button class="button-g button-1 button-wide" value="exit"
                onclick="exitApp();">終了</button>
        </div>
    </div>
    <footer>
        <p><small>&copy; 2025 Satsuma Ebisudo All Rights Reserved. </small></p>
    </footer>
    <script>
        /// dom
        // CSV file dom
        const csvfileDom = document.getElementById('csvfilepath');
        // tentacles dom
        const tentaclesDom = document.getElementById('tentacles');
        // scraping url dom
        const scrapingurlDom = document.getElementById('scrapingurl');
        // scraping status dom
        const scrapingstatusDom = document.getElementById('scrapingstatus');
        // success dom
        const successDom = document.getElementById('success');
        // fail dom
        const failDom = document.getElementById('fail');
        // success total dom
        const successtotalDom = document.getElementById('successtotal');
        // fail total dom
        const failtotalDom = document.getElementById('failtotal');
        // total counter
        window.api.on('total', arg => {
            // success
            successtotalDom.innerHTML = arg;
            // fail
            failtotalDom.innerHTML = arg;
        });
        // success counter
        window.api.on('success', arg => {
            // success
            successDom.innerHTML = arg;
        });
        // fail counter
        window.api.on('fail', arg => {
            // fail
            failDom.innerHTML = arg;
        });
        // shop info
        window.api.on("shopinfoCsvlist", arg => {
            try {
                // convert to JSON
                const serializedArray = JSON.stringify(arg);
                // save localStorage
                localStorage.setItem('shopinfoArray', serializedArray);
                // file path
                csvfileDom.innerHTML = arg.filename;
            } catch (e) {
                // error
                console.log(e);
            }
        });
        // url Update
        window.api.on("urlUpdate", arg => {
            try {
                // url Update
                scrapingurlDom.innerHTML = `${arg}`;
            } catch (e) {
                // error
                console.log(e);
            }
        });
        // status Update
        window.api.on("statusUpdate", arg => {
            try {
                // status Update
                scrapingstatusDom.innerHTML =
                    `scraping: ${arg.店名1} ${arg.電話番号}`;
            } catch (e) {
                // error
                console.log(e);
            }
        });
        // read CSV
        const readCSV = () => {
            try {
                // read CSV
                window.api.send("csv", '');
            } catch (e) {
                // error
                console.log(e);
            }
        }
        // start scraping
        const gotoScrape = () => {
            try {
                // initialize form
                successDom.innerHTML = '';
                failDom.innerHTML = '';
                successtotalDom.innerHTML = '';
                failtotalDom.innerHTML = '';
                // start position
                const startPos = tentaclesDom.value;
                // shop ul list
                const serializedArray = JSON.parse(localStorage.getItem(
                    'shopinfoArray'));
                // send obj
                const sendObj = {
                    pos: startPos,
                    urls: serializedArray,
                }
                // start scraping
                window.api.send("scrape", sendObj);
            } catch (e) {
                // error
                console.log(e);
            }
        }
        // pause Scraping
        const pauseScrape = () => {
            try {
                // pause Scraping
                window.api.send("pause");
            } catch (e) {
                // error
                console.log(e);
            }
        }
        // exit App
        const exitApp = () => {
            try {
                // exit App
                window.api.send("exit");
            } catch (e) {
                // error
                console.log(e);
            }
        }
        // page transfer
        const transfer = channel => {
            try {
                // page transfer
                window.api.send("page", channel);
            } catch (e) {
                // error
                console.log(e);
            }
        }
    </script>
</body>
</html>
