<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <title>NAVTIME スクレイピング</title>
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
  <link rel="stylesheet" href="css/index.css">
</head>

<body>
  <h1>NAVTIME スクレイピング</h1>
  <div class="wrapper">
    <div class="button_area">
      <div class="operation_area">
        <h3>NAVTIME スクレイピング</h3>
        <div class="operation_area">
          <h3>CSV読込</h3>
          <div><button class="button-g button-wide" value="regist" onclick="readCSV();">CSV読込</button></div>
          <div id="csvfilepath"></div>
        </div>
        <div>
          <button class="button-g button-wide" value="edit" onclick="gotoScrape();">開始</button>
        </div>
        <div>
          <button class="button-g button-wide" onclick="pauseScrape();">一時停止</button>
        </div>
      </div>
      <div class="operation_area">
        <div><button class="button-g button-4 button-wide" value="exit" onclick="exitApp();">終了</button></div>
      </div>
    </div>
  </div>

  <footer>
    <p><small>&copy; 2026 Satsuma Ebisudo All Rights Reserved. </small></p>
  </footer>

  <script>
    /// dom
    // CSV file dom
    const csvfileDom = document.getElementById('csvfilepath');

     // shop info
    window.api.on('shopinfoCsvlist', arg => {
      try {
        // convert to JSON
        const serializedArray = JSON.stringify(arg);
        // save localStorage
        localStorage.setItem('shopinfoArray', serializedArray);
        // file path
        csvfileDom.innerHTML = arg.filename;

      } catch (e) {
        // error
        console.log(e);
      }
    });

    // read CSV
    const readCSV = () => {
      try {
        // read CSV
        window.api.send('csv', '');

      } catch (e) {
        // error
        console.log(e);
      }
    }

    // start scraping
    const gotoScrape = () => {
      try {
        // shop ul list
          const serializedArray = JSON.parse(localStorage.getItem('shopinfoArray'));
        // scraping
        window.api.send("scrape", serializedArray);

      } catch (e) {
        // error
        console.log(e);
      }
    }

    // pause scraping
    const pauseScrape = () => {
      try {
        // pause scraping
        window.api.send("pause", '');

      } catch (e) {
        // error
        console.log(e);
      }
    }

    // exit app
    const exitApp = () => {
      try {
        // exit app
        window.api.send("exit", '');

      } catch (e) {
        // error
        console.log(e);
      }
    }
  </script>
</body>

</html>
