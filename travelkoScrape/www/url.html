<!DOCTYPE html>
<html lang="ja">

  <head>
    <meta charset="utf-8">
    <title>トラベルコURL取得画面</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/button.css">
  </head>

  <body>
    <h1>トラベルコURL取得画面</h1>
    <div class="wrapper">
      <div class="operation_area">
        <div class="button_area">
          <h4>開始位置</h4>
          <div>
            <input type="number" id="tentacles" name="tentacles" min="1" max="50000">
          </div>
          <div><button class="button-g button-4 button-wide" onclick="gotoScrape();">開始</button></div>
          <div><button class="button-g button-3 button-wide" onclick="pauseScrape();">中断</button></div>
        </div>
      </div>
      <div class="progress_area">
        <div>成功:<span id="success"></span>/<span id="successtotal"></span></div>
        <div>失敗:<span id="fail"></span>/<span id="failtotal"></span></div>
      </div>
      <div class="operation_area">
        <h3>ステータス</h3>
        <div id="scrapingstatus"></div>
      </div>
      <div class="operation_area">
        <button type="button" id="topbutton" class="button-g button-6 button-wide" role="button"
          onclick="transfer('top_page');">トップへ戻る</button>
      </div>
      <div class="button_area">
        <button class="button-g button-3 button-wide" value="exit" onclick="exitApp();">終了</button>
      </div>
    </div>
    <footer>
      <p>
        <small>&copy; 2026 Satsuma Ebisudo All Rights Reserved.</small>
      </p>
    </footer>

    <script>
      /// dom
      // tentacles dom
      const tentaclesDom = document.getElementById('tentacles');
      // status
      const scrapingstatusDom = document.getElementById('scrapingstatus');
      // successtotal
      const successtotalDom = document.getElementById('successtotal');
      // success
      const successDom = document.getElementById('success');
      // failtotal
      const failtotalDom = document.getElementById('failtotal');
      // fail
      const failDom = document.getElementById('fail');
      // startarea
      const startAreaDom = document.getElementById('startarea');

      // pref total
      window.api.on('console', arg => {
        // pref total dom
        console.log(arg);
      });

      // shop total
      window.api.on('urltotal', arg => {
        // shop success total dom
        successtotalDom.innerHTML = arg;
        // shop fail total dom
        failtotalDom.innerHTML = arg;
      });
      // success
      window.api.on('urlsuccess', arg => {
        console.log('success: ' + arg);
        // area success dom
        successDom.innerHTML = arg;
      });
      // fail
      window.api.on('urlfail', arg => {
        console.log('fail: ' + arg);
        // area fail dom
        failDom.innerHTML = arg;
      });
      // status Update
      window.api.on('statusUpdate', arg => {
        try {
          // status Update
          scrapingstatusDom.innerHTML = `
          scraping url: ${arg}`;

        } catch (e) {
          // error
          console.log(e);
        }
      });
      // page transfer
      const transfer = channel => {
        try {
          // page transfer
          window.api.send('page', channel);

        } catch (e) {
          // error
          console.log(e);
        }
      }
      // start scraping
      const gotoScrape = () => {
        try {
          // start position
          const startPos = tentaclesDom.value;
          // initialize form
          scrapingstatusDom.innerHTML = '';
          // start scraping
          window.api.send('scrapeurl', startPos);

        } catch (e) {
          // error
          console.log(e);
        }
      }
      // pause Scraping
      const pauseScrape = () => {
        try {
          // pause Scraping
          window.api.send("pause", false);
        } catch (e) {
          // error
          console.log(e);
        }
      }
      // exit App
      const exitApp = () => {
        try {
          // exit App
          window.api.send('exit');

        } catch (e) {
          // error
          console.log(e);
        }
      }
    </script>
  </body>

</html>
