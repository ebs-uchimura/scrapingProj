<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <title>&Bar scraper</title>
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
  <link rel="stylesheet" href="css/index.css">
</head>

<body>
  <h1>&Bar shopinfo scraper</h1>
  <div class="wrapper">
    <div class="button_area">
      <div class="operation_area">
        <h3>read CSV</h3>
        <button class="button-g button-1 button-wide" value="regist"
          onclick="readCSV();">read CSV</button>
        <div id="csvfilepath"></div>
      </div>
      <div class="operation_area">
        <h3>scraping</h3>
        <button class="button-g button-1 button-wide"
          onclick="gotoScrape();">start scraping</button><br><br>
        <button class="button-g button-wide" onclick="pauseScrape();">pause scraping</button>
      </div>
      <div class="progressarea">
        <div>success:<span id="success"></span>/<span id="successtotal"></span></div>
        <div>fail:<span id="fail"></span>/<span id="failtotal"></span></div>
      </div>
      <div class="operation_area">
        <button class="button-g button-wide" value="reader" onclick="clearCSV()">clear</button><br><br>
        <button type="button" id="topbutton" class="button-6 button-g button-wide" role="button"
          onclick="transfer('top_page');">goto top</button>
      </div>
      <div class="operation_area">
        <button class="button-g button-1 button-wide" value="exit" onclick="exitApp();">exit</button>
      </div>
    </div>

    <footer>
      <p><small>&copy; 2024 Satsuma Ebisudo All Rights Reserved. </small></p>
    </footer>

    <script>
      // csv file Dom
      const csvfileDom = document.getElementById('csvfilepath');
      // successDom
      const successDom = document.getElementById('success');
      // failDom
      const failDom = document.getElementById('fail');
      // successtotalDom
      const successtotalDom = document.getElementById('successtotal');
      // failtotalDom
      const failtotalDom = document.getElementById('failtotal');

      // show total
      window.api.on('total', arg => {
        // total success
        successtotalDom.innerHTML = arg;
        // fail success
        failtotalDom.innerHTML = arg;
      });

      // show success
      window.api.on('success', arg => {
        // success
        successDom.innerHTML = arg;
      });

      // show fail
      window.api.on('fail', arg => {
        // fail
        failDom.innerHTML = arg;
      });

      // shop information
      window.api.on("shopinfoCsvlist", arg => {
        try {
          // user list
          const shopinfoArray = arg.record.flat();
          // JSON string
          const serializedArray = JSON.stringify(shopinfoArray);
          // save localStorage
          localStorage.setItem('shopinfoArray', serializedArray);
          // show file path
          csvfileDom.innerHTML = arg.filename;

        } catch (e) {
          // error
          console.log(e);
        }
      });

      // read CSV
      const readCSV = () => {
        try {
          //  read CSV
          window.api.send("csv", '');

        } catch (e) {
          // error
          console.log(e);
        }
      }

      // clear CSV
      const clearCSV = () => {
        try {
          // clear localStorage 
          localStorage.clear();
          // clear file path
          csvfileDom.innerHTML = "";

        } catch (e) {
          // error
          window.api.send("error", e);
        }
      }

      // start scraping
      const gotoScrape = () => {
        try {
          // initialize counter
          successDom.innerHTML = '';
          failDom.innerHTML = '';
          successtotalDom.innerHTML = '';
          failtotalDom.innerHTML = '';
          // shop urls
          const serializedArray = JSON.parse(localStorage.getItem('shopinfoArray'));
          // scrape
          window.api.send("scrape", serializedArray);

        } catch (e) {
          // error
          console.log(e);
        }
      }

      // stop scraping
      const pauseScrape = () => {
        try {
          // stop scraping
          window.api.send("pause", 'shop');

        } catch (e) {
          // error
          console.log(e);
        }
      }

      // exit app
      const exitApp = () => {
        try {
          // exit app
          window.api.send("exit");

        } catch (e) {
          // error
          console.log(e);
        }
      }

      // page transfer
      const transfer = channel => {
        try {
          // page transfer
          window.api.send("page", channel);

        } catch (e) {
          // error
          console.log(e);
        }
      }
    </script>
</body>

</html>
