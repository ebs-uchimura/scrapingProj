<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <title>&Bar scraper</title>
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
  <link rel="stylesheet" href="css/index.css">
</head>

<body>
  <h1>&Bar scraper</h1>
  <div class="buttonarea">
    <div class="operation_area">
      <h3>getURL</h3>
      <button class="button-g button-wide" value="url" onclick="transfer('url_page');">get URL Page</button>
    </div>
    <div class="operation_area">
      <h3>getShopURL</h3>
      <button class="button-g button-wide" value="shop" onclick="transfer('shop_page');">get ShopURL Page</button>
    </div>
    <div class="operation_area">
      <button class="button-g button-1 button-wide" value="exit" onclick="exitApp()">exit</button>
    </div>
  </div>
  <footer>
    <p><small>&copy; 2024 Satsuma Ebisudo All Rights Reserved. </small></p>
  </footer>

  <script>
    // exit App
    const exitApp = () => {
      try {
        // send exit sign
        window.api.send("exit");

      } catch (e) {
        // error
        console.log(e);
      }
    }
    // page transfer
    const transfer = channel => {
      try {
        // send transfer sign
        window.api.send("page", channel);

      } catch (e) {
        // error
        console.log(e);
      }
    }
  </script>
</body>

</html>
